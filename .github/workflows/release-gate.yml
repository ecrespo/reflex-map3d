name: Release gate

# Everything a pull request into main must satisfy before it can be merged
# and released: correct source branch, a bumped version, a changelog entry,
# the full CI suite and the full security suite.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-branch:
    name: Source branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Only develop or hotfix/* may target main
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == hotfix/* ]]; then
            echo "Source branch '$HEAD_REF' is allowed to target main."
          else
            echo "::error::'$HEAD_REF' cannot target main. Merge into develop first, or use a hotfix/* branch."
            exit 1
          fi

  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging
        run: python -m pip install --quiet packaging

      - name: Decide whether this is a release
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tomllib

          from packaging.version import InvalidVersion, Version


          def fail(message: str) -> None:
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)


          def parse(source: bytes) -> str:
              return tomllib.loads(source.decode())["project"]["version"]


          def released_versions() -> list[Version]:
              """Versions that actually shipped, which is what tags record."""
              out = subprocess.run(
                  ["git", "tag", "--list", "v*"], capture_output=True, text=True
              ).stdout.split()
              versions = []
              for tag in out:
                  try:
                      versions.append(Version(tag.removeprefix("v")))
                  except InvalidVersion:
                      continue
              return sorted(versions)


          head_raw = parse(pathlib.Path("pyproject.toml").read_bytes())
          base_sha = os.environ["BASE_SHA"]
          base_proc = subprocess.run(["git", "show", f"{base_sha}:pyproject.toml"], capture_output=True)
          base_raw = parse(base_proc.stdout) if base_proc.returncode == 0 else "0.0.0"

          try:
              head, base = Version(head_raw), Version(base_raw)
          except InvalidVersion as exc:
              fail(f"Version is not PEP 440 compliant: {exc}")

          shipped = released_versions()
          latest = shipped[-1] if shipped else None

          print(f"main: {base}   this PR: {head}   latest release: {latest or 'none'}", file=sys.stderr)

          if head < base:
              fail(f"Version {head} is below main's {base}. Versions never go backwards.")
          if latest is not None and head < latest:
              fail(f"Version {head} is below the released {latest}. Versions never go backwards.")

          if latest is not None and head == latest:
              # Already on PyPI. release.yml sees the tag and no-ops, so this is a
              # maintenance change to main rather than a release.
              if head != base:
                  fail(f"Version {head} is already released, but main is at {base}. Refusing an ambiguous state.")
              print("mode=maintenance")
              print("will_release=false")
              print(f"version={head}")
              print(f"tag=v{head}")
              print(f"No release: {head} is already tagged and published.", file=sys.stderr)
              sys.exit(0)

          changelog = pathlib.Path("CHANGELOG.md")
          if not changelog.exists():
              fail("CHANGELOG.md is missing.")
          if not re.search(rf"^##\s*\[?{re.escape(str(head))}\]?", changelog.read_text(encoding="utf-8"), re.MULTILINE):
              fail(f"CHANGELOG.md has no '## [{head}]' section.")

          print("mode=release")
          print("will_release=true")
          print(f"version={head}")
          print(f"tag=v{head}")
          print(f"Release: {head} will be tagged and published on merge.", file=sys.stderr)
          PY

      - name: Summary
        env:
          MODE: ${{ steps.check.outputs.mode }}
          VERSION: ${{ steps.check.outputs.version }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          {
            echo "### Release gate"
            echo
            if [[ "$MODE" == "release" ]]; then
              echo "Merging this pull request releases \`$VERSION\` and tags it \`$TAG\`."
            else
              echo "Maintenance change. \`$VERSION\` is already tagged and published,"
              echo "so merging this pull request releases nothing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  code-validation:
    name: Code validation
    needs: [source-branch]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-validation:
    name: Security validation
    needs: [source-branch]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [source-branch, version, code-validation, security-validation]
    if: always()
    steps:
      - name: Require every gate job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Gate job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Release gate failed (a required job reported '$result')."
              exit 1
            fi
          done
          echo "Release gate passed. This PR is ready to merge into main."
