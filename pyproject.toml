[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-map3d"
version = "0.1.1"
description = "Generate a real-world 3D city from OpenStreetMap data in Reflex — a port of cartesiancs/map3d to React-Three-Fiber components for Reflex."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "map3d",
    "openstreetmap",
    "three.js",
    "react-three-fiber",
    "gis",
    "digital-twin",
    "glb",
]

dependencies = ["reflex>=0.9.0", "httpx>=0.24"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-map3d"
Source = "https://github.com/ecrespo/reflex-map3d"
Issues = "https://github.com/ecrespo/reflex-map3d/issues"
Upstream = "https://github.com/cartesiancs/map3d"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "twine>=5",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_map3d = ["*.js", "*.jsx", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Reflex generates the .pyi stubs; they are not hand-written source.
extend-exclude = ["*.pyi", ".web", "map3d_demo/.web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.mypy]
python_version = "3.10"
mypy_path = "custom_components"
packages = ["reflex_map3d"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = [".venv", ".web", "tests", "map3d_demo"]

[tool.coverage.run]
source = ["reflex_map3d"]
branch = true

[tool.coverage.report]
show_missing = true
